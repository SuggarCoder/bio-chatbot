services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-chatbot:latest
    container_name: ai-chatbot

    restart: unless-stopped

    init: true

    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
      HOST: 0.0.0.0
      PORT: "8090"
      APP_COMMIT: "${APP_COMMIT:-local}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3.8-max-preview}"
      QWEN_MAX_OUTPUT_TOKENS: "${QWEN_MAX_OUTPUT_TOKENS:-4096}"
      GPAS2_AUTH_MODE: "${GPAS2_AUTH_MODE:-upstream}"
      GPAS2_USER_INFO_URL: "${GPAS2_USER_INFO_URL}"
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
      CHAT_RATE_LIMIT_PER_MINUTE: "${CHAT_RATE_LIMIT_PER_MINUTE:-10}"
      MAX_CONCURRENT_GENERATIONS: "${MAX_CONCURRENT_GENERATIONS:-1}"
      MONTHLY_TOKEN_LIMIT: "${MONTHLY_TOKEN_LIMIT:-0}"
      GENERATION_LEASE_SECONDS: "${GENERATION_LEASE_SECONDS:-120}"

    networks:
      - chatbot-backend

    ports:
      - "10.88.20.19:8090:8090"

    networks:
      - chatbot-backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8090/ai-chatbot/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    security_opt:
      - no-new-privileges:true

networks:
  chatbot-backend:
    external: true
    name: chatbot-backend
