services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-chatbot:latest
    container_name: ai-chatbot

    restart: unless-stopped

    init: true

    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
      HOST: 0.0.0.0
      PORT: "8090"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS must identify the reverse proxy IP or CIDR}"
      APP_COMMIT: "${APP_COMMIT:-local}"
      DATABASE_URL: "${DATABASE_URL}"
      PG_POOL_MAX: "${API_PG_POOL_MAX:-4}"
      REDIS_URL: "${REDIS_URL}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-gpas2cb:prod:v3:}"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3.6-flash}"
      QWEN_MAX_OUTPUT_TOKENS: "${QWEN_MAX_OUTPUT_TOKENS:-4096}"
      GPAS2_AUTH_MODE: "${GPAS2_AUTH_MODE:-upstream}"
      GPAS2_USER_INFO_URL: "${GPAS2_USER_INFO_URL}"
      CHAT_RATE_LIMIT_PER_MINUTE: "${CHAT_RATE_LIMIT_PER_MINUTE:-10}"
      MONTHLY_TOKEN_LIMIT: "${MONTHLY_TOKEN_LIMIT:-0}"
      GLOBAL_GENERATION_CONCURRENCY: "${GLOBAL_GENERATION_CONCURRENCY:-4}"
      PROVIDER_GENERATION_CONCURRENCY: "${PROVIDER_GENERATION_CONCURRENCY:-4}"
      MODEL_GENERATION_CONCURRENCY: "${MODEL_GENERATION_CONCURRENCY:-4}"
      GENERATION_TIMEOUT_MS: "${GENERATION_TIMEOUT_MS:-180000}"
      GENERATION_LOCK_LEASE_MS: "${GENERATION_LOCK_LEASE_MS:-30000}"
      GENERATION_LOCK_RENEW_INTERVAL_MS: "${GENERATION_LOCK_RENEW_INTERVAL_MS:-10000}"
      GENERATION_CANCEL_POLL_INTERVAL_MS: "${GENERATION_CANCEL_POLL_INTERVAL_MS:-300}"
      GENERATION_SNAPSHOT_INTERVAL_MS: "${GENERATION_SNAPSHOT_INTERVAL_MS:-1000}"
      OBJECT_STORAGE_ENABLED: "${OBJECT_STORAGE_ENABLED:-false}"
      ARTIFACT_PROTOCOL_ENABLED: "${ARTIFACT_PROTOCOL_ENABLED:-false}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      S3_MAX_ATTEMPTS: "${S3_MAX_ATTEMPTS:-3}"
      S3_SERVER_SIDE_ENCRYPTION: "${S3_SERVER_SIDE_ENCRYPTION:-}"

    ports:
      - "10.88.20.19:8090:8090"

    networks:
      - chatbot-backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8090/ai-chatbot/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  worker:
    image: ai-chatbot:latest
    container_name: ai-chatbot-worker
    restart: unless-stopped
    init: true
    command: ["node", "dist/server/worker.js"]
    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
      HOST: 0.0.0.0
      PORT: "8090"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS must identify the reverse proxy IP or CIDR}"
      DATABASE_URL: "${DATABASE_URL}"
      PG_POOL_MAX: "${WORKER_PG_POOL_MAX:-4}"
      REDIS_URL: "${REDIS_URL}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-gpas2cb:prod:v3:}"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3.6-flash}"
      QWEN_MAX_OUTPUT_TOKENS: "${QWEN_MAX_OUTPUT_TOKENS:-4096}"
      GPAS2_AUTH_MODE: "${GPAS2_AUTH_MODE:-upstream}"
      GPAS2_USER_INFO_URL: "${GPAS2_USER_INFO_URL}"
      CHAT_RATE_LIMIT_PER_MINUTE: "${CHAT_RATE_LIMIT_PER_MINUTE:-10}"
      MONTHLY_TOKEN_LIMIT: "${MONTHLY_TOKEN_LIMIT:-0}"
      GLOBAL_GENERATION_CONCURRENCY: "${GLOBAL_GENERATION_CONCURRENCY:-4}"
      PROVIDER_GENERATION_CONCURRENCY: "${PROVIDER_GENERATION_CONCURRENCY:-4}"
      MODEL_GENERATION_CONCURRENCY: "${MODEL_GENERATION_CONCURRENCY:-4}"
      GENERATION_TIMEOUT_MS: "${GENERATION_TIMEOUT_MS:-180000}"
      GENERATION_LOCK_LEASE_MS: "${GENERATION_LOCK_LEASE_MS:-30000}"
      GENERATION_LOCK_RENEW_INTERVAL_MS: "${GENERATION_LOCK_RENEW_INTERVAL_MS:-10000}"
      GENERATION_CANCEL_POLL_INTERVAL_MS: "${GENERATION_CANCEL_POLL_INTERVAL_MS:-300}"
      GENERATION_SNAPSHOT_INTERVAL_MS: "${GENERATION_SNAPSHOT_INTERVAL_MS:-1000}"
      OBJECT_STORAGE_ENABLED: "${OBJECT_STORAGE_ENABLED:-false}"
      ARTIFACT_PROTOCOL_ENABLED: "${ARTIFACT_PROTOCOL_ENABLED:-false}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      S3_MAX_ATTEMPTS: "${S3_MAX_ATTEMPTS:-3}"
      S3_SERVER_SIDE_ENCRYPTION: "${S3_SERVER_SIDE_ENCRYPTION:-}"
    networks:
      - chatbot-backend
    security_opt:
      - no-new-privileges:true

networks:
  chatbot-backend:
    external: true
    name: chatbot-backend
