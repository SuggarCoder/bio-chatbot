# Scrapes the chatbot's internal metrics ports and the infrastructure
# exporters started by compose.monitoring.yml. Containers share the
# `chatbot-backend` network, so services are addressed by name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: chatbot-api
    static_configs:
      - targets: ['app:9464', 'app-2:9464']
  - job_name: chatbot-worker
    static_configs:
      - targets: ['worker:9464', 'worker-2:9464']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
